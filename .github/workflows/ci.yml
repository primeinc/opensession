# ──────────────────────────────────────────────────────────────────────────────
# CI – Cross-platform unit + E2E test suite
#
# PURPOSE
#   Runs Bun-based unit tests and Next.js E2E tests on Ubuntu, macOS, and
#   Windows so that cross-platform regressions (e.g. the Windows NTFS junction
#   path bug) are caught on every pull request and every push to main.
#
# TRIGGER STRATEGY (GitHub Actions best practice – March 2026)
#   Combining `push: branches: [main]` with `pull_request:` (no branch filter)
#   is the canonical pattern to avoid duplicate runs:
#     • On a PR branch, only the `pull_request` event fires.
#     • On a direct push to main (merges, hotfixes), only the `push` event fires.
#   Using `push: branches: ["**"]` together with `pull_request:` would cause two
#   runs for every PR push – that pattern is explicitly discouraged.
#   Ref: https://docs.github.com/en/actions/writing-workflows/choosing-when-your-workflow-runs/events-that-trigger-workflows#pull_request
#
# ACTION VERSION PINNING (security best practice – March 2026)
#   GitHub's own hardening guide recommends pinning third-party actions to a
#   full commit SHA (e.g. `actions/checkout@<sha>`) rather than a mutable
#   semantic-version tag.  This workflow uses major-version tags (@v5, @v6)
#   for readability; Dependabot or Renovate should be configured to keep them
#   current and to supply SHA pins in production.
#   DEVIATION: mutable major-version tags are used instead of SHA pins.
#   Ref: https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions#using-third-party-actions
#
# JOB TIMEOUT (best practice – March 2026)
#   GitHub Actions jobs default to a 6-hour (360-minute) timeout.  Omitting an
#   explicit `timeout-minutes` means a stalled E2E server can block a runner
#   slot for up to 6 hours.  The `bun test --timeout 90000` flag (90 s per
#   test) is a per-test guard, not a job guard.
#   DEVIATION: no explicit `timeout-minutes` is set on the job.  This is
#   acceptable for now because the E2E test itself hard-fails after 90 s and
#   the unit tests complete in under 30 s, giving a practical ceiling well
#   below the GitHub default.
# ──────────────────────────────────────────────────────────────────────────────
name: CI

on:
  # Fire on pushes to main only (not on every branch push).
  push:
    branches: [main]
  # Fire on every pull request, regardless of target branch.
  pull_request:

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    # PRINCIPLE OF LEAST PRIVILEGE (best practice – March 2026)
    # Grant only the permissions this job actually needs.  A pure test job only
    # reads source code; no write access to contents, packages, or deployments
    # is required.
    # Ref: https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/controlling-permissions-for-github_token
    permissions:
      contents: read

    strategy:
      # FAIL-FAST DISABLED (intentional deviation from default)
      # GitHub Actions default is `fail-fast: true`, which cancels all in-
      # progress matrix legs as soon as one fails.  We explicitly set `false`
      # so that failures on one OS do not suppress results from the others –
      # this is particularly useful when diagnosing platform-specific bugs.
      # Ref: https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/running-variations-of-jobs-in-a-workflow#handling-failures
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      # ────────────────────────────────────────────────────────────────────────
      # 1. CHECKOUT
      #    Fetches the repository at the triggering commit (shallow by default –
      #    fetch-depth: 1 is the actions/checkout default and is correct here
      #    because tests do not need git history).
      #    Ref: https://github.com/actions/checkout
      # ────────────────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v6

      # ────────────────────────────────────────────────────────────────────────
      # 2. SET UP BUN
      #    Installs Bun via the official oven-sh/setup-bun action.
      #
      #    bun-version: "1.x"
      #      Selects the latest stable patch release within the v1 major line.
      #      First-party Bun CI docs show `bun-version: latest` for the absolute
      #      latest, or a fully pinned version (e.g. "1.2.5") for strict
      #      reproducibility.
      #      DEVIATION: "1.x" is a floating range; minor and patch updates within
      #      v1 are accepted automatically.  This trades reproducibility for
      #      staying current with bug fixes.  Renovate/Dependabot should be
      #      configured to propose explicit-version bumps in production.
      #      Ref: https://bun.sh/guides/install/ci
      #      Ref: https://github.com/oven-sh/setup-bun
      # ────────────────────────────────────────────────────────────────────────
      - name: Set up Bun
        id: setup-bun
        uses: oven-sh/setup-bun@v2.1.3
        with:
          bun-version: 1.x

      # ────────────────────────────────────────────────────────────────────────
      # 3. CACHE BUN PACKAGE STORE
      #    Caches Bun's global package store to speed up `bun install`.
      #
      #    Cache path: ~/.bun/install/cache
      #      This is the directory Bun uses as its shared package store across
      #      all projects on the machine.  Caching it avoids re-downloading
      #      packages on every run.
      #      Ref: https://bun.sh/docs/install/cache
      #
      #    Cache key: bun.lock (text lockfile, Bun ≥ 1.2)
      #      Bun 1.2 replaced the binary `bun.lockb` with a human-readable text
      #      file named `bun.lock`.  The cache key hashes this file, so the
      #      cache is invalidated whenever any dependency changes.
      #      DEVIATION FROM OLDER BUN DOCS: guides written before Bun 1.2 show
      #      `hashFiles('bun.lockb')`.  This project uses `bun.lock` because it
      #      was initialised with Bun ≥ 1.2.
      #      Ref: https://bun.sh/blog/bun-v1.2 (lockfile format change)
      #
      #    restore-keys: prefix fallback
      #      If no exact-match key is found, the most recent cache for the same
      #      OS is restored.  This avoids a full cold install after minor
      #      dependency changes.
      #      Ref: https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/caching-dependencies-to-speed-up-workflows
      # ────────────────────────────────────────────────────────────────────────
      - name: Cache bun package store
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      # ────────────────────────────────────────────────────────────────────────
      # 4. INSTALL DEPENDENCIES
      #    `bun install --frozen-lockfile` is the Bun-recommended CI install
      #    command.  It refuses to modify bun.lock, so CI fails loudly if the
      #    lockfile is out of date rather than silently installing different
      #    versions than what was committed.
      #    Ref: https://bun.sh/docs/cli/install#ci-mode
      # ────────────────────────────────────────────────────────────────────────
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # ────────────────────────────────────────────────────────────────────────
      # 5. UNIT TESTS
      #    Runs tests in tests/unit/ using bun's built-in test runner.
      #    No --timeout flag is needed here: unit tests complete in < 100 ms
      #    each; the default per-test timeout (5 000 ms in Bun 1.x) is ample.
      #    Ref: https://bun.sh/docs/cli/test
      # ────────────────────────────────────────────────────────────────────────
      - name: Unit tests
        run: bun test tests/unit

      # ────────────────────────────────────────────────────────────────────────
      # 6. E2E TESTS
      #    Runs tests in tests/e2e/ which start a real Next.js dev server and
      #    hit API routes with live HTTP requests.
      #
      #    --timeout 90000
      #      Sets a 90-second per-test timeout (milliseconds).  The beforeAll
      #      hook waits up to 60 s for the Next.js server to start; the extra
      #      30 s gives individual requests room to complete.  The default Bun
      #      per-test timeout (5 000 ms) is far too short for E2E workloads.
      #      Ref: https://bun.sh/docs/cli/test#timeout
      # ────────────────────────────────────────────────────────────────────────
      - name: E2E tests
        run: bun test --timeout 90000 tests/e2e
